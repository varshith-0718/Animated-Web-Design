name: Update GitHub projects

on:
  schedule:
    # Runs once a day at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch: {} # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-portfolio-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Refresh GitHub projects list
        run: npm run update:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/src/data/portfolio.json
          git diff --cached --quiet || git commit -m "chore: refresh GitHub projects list"
          git push
